name: PGH temporary HURDAT2 portability repair
on:
  push:
    branches:
      - research/pgh1-hurdat2-five-candidate-analysis-prereg
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and validate repair
        run: |
          set -euo pipefail
          python3 tools/_temp_repair_hurdat_portability.py
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic -Werror tools/pgh_hurdat2_five_candidate.cpp -o /tmp/pgh_hurdat2_five_candidate
          /tmp/pgh_hurdat2_five_candidate --self-test
          if grep -nE 'boost|std::(random|shuffle|uniform_|discrete_distribution|mt19937)|__int128' tools/pgh_hurdat2_five_candidate.cpp; then
            echo 'Forbidden dependency or stochastic implementation found'
            exit 1
          fi
          sha256sum tools/pgh_hurdat2_five_candidate.cpp
          rm tools/_temp_repair_hurdat_portability.py
          rm .github/workflows/pgh-hurdat2-portability-repair-temp.yml
      - name: Commit repaired staged candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair HURDAT2 reference implementation portability'
          git push
